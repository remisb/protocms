openapi: 3.1.0
info:
  title: ProtoCMS API
  description: |
    A prototype in-memory headless CMS built with Go 1.26 stdlib.
    Supports dynamic content types and flexible content items persisted to JSON on disk.
  version: 1.0.0
  contact: {}

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Service health and diagnostics
  - name: Stats
    description: Dataset statistics
  - name: Content Types
    description: Manage content type schemas
  - name: Content
    description: Manage content items for a given content type
  - name: Datasets
    description: Admin-only management of in-memory datasets

paths:
  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      tags: [Health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: Go 1.26 stdlib POC with Field Types
                  timestamp:
                    type: string
                    example: "2026-06-13 10:00:00.000000000 +0000 UTC"

  /api/stats:
    get:
      summary: Get dataset statistics
      operationId: getStats
      tags: [Stats]
      description: |
        Requires any valid bearer token. The dataset is determined by the
        authenticated API key or JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current dataset statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/metrics:
    get:
      summary: Get query metrics and dataset info for the caller
      operationId: getMetrics
      tags: [Stats]
      description: |
        Requires a bearer token with the `admin` or `editor` role. Returns the
        caller's dataset info: stats, estimated memory, and query metrics. The
        dataset is determined by the authenticated API key or JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dataset info for the authenticated caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/content-types:
    get:
      summary: List all content types
      operationId: listContentTypes
      tags: [Content Types]
      description: |
        Requires any valid bearer token. The dataset is determined by the
        authenticated API key or JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of registered content type schemas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create a content type
      operationId: createContentType
      tags: [Content Types]
      description: Requires a bearer token with the `admin` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentType'
            example:
              name: post
              fields:
                title:
                  type: text
                  required: true
                body:
                  type: textarea
      responses:
        '201':
          description: Content type created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentType'
        '400':
          description: Invalid request body or missing name/fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/login:
    post:
      summary: Authenticate and obtain a JWT
      operationId: login
      tags: [Auth]
      description: |
        Exchanges a username/password (configured via `PROTOCMS_USERS`) for an
        HS256 JWT. Disabled (503) when `PROTOCMS_JWT_SECRET` is not set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
            example:
              username: jane
              password: pw
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: "HS256 JWT to send as `Authorization: Bearer <token>`"
                  role:
                    type: string
                    enum: [admin, editor]
                  expires_in:
                    type: integer
                    description: Token lifetime in seconds
        '400':
          description: Invalid JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Login disabled (no JWT secret configured)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/me:
    get:
      summary: Get the current token's identity and role
      operationId: getMe
      tags: [Auth]
      description: |
        Returns the subject and roles of the presented bearer token.
        Requires any valid token (`admin` or `editor`).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The authenticated principal
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: string
                    description: Token subject (`apikey` for static keys, the username for JWTs)
                  roles:
                    type: array
                    items:
                      type: string
                      enum: [admin, editor]
                  dataset:
                    type: string
                    description: Name of the dataset resolved from the credential
                example:
                  subject: jane
                  roles: [editor]
                  dataset: default
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/content/{contentType}:
    parameters:
      - $ref: '#/components/parameters/contentType'

    get:
      summary: List content items
      operationId: listContent
      tags: [Content]
      description: |
        Requires any valid bearer token. The dataset is determined by the
        authenticated API key or JWT.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of items to return
          required: false
          schema:
            type: integer
            minimum: 1
        - name: <fieldName>
          in: query
          description: |
            Any field name defined on the content type can be used as a filter.
            Values are matched as strings (works for strings, numbers, booleans).
            Example: `?category_id=1`
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of content items (empty array if type has no items)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentItem'
        '400':
          description: Missing content type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      summary: Create a content item
      operationId: createContent
      tags: [Content]
      description: Requires a bearer token with the `admin` or `editor` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentItemInput'
            example:
              title: Hello
              body: World
      responses:
        '201':
          description: Content item created, auto-assigned `id` included
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          description: Missing content type, unknown content type, or invalid JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/content/{contentType}/{id}:
    parameters:
      - $ref: '#/components/parameters/contentType'
      - $ref: '#/components/parameters/id'

    get:
      summary: Get a single content item
      operationId: getContent
      tags: [Content]
      description: |
        Requires any valid bearer token. The dataset is determined by the
        authenticated API key or JWT.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The requested content item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          description: Missing content type or id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update a content item
      operationId: updateContent
      tags: [Content]
      description: Requires a bearer token with the `admin` or `editor` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentItemInput'
            example:
              title: Updated Title
              body: Updated body text
      responses:
        '200':
          description: Updated content item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentItem'
        '400':
          description: Missing content type or id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Delete a content item
      operationId: deleteContent
      tags: [Content]
      description: Requires a bearer token with the `admin` or `editor` role.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Item deleted successfully (no body)
        '400':
          description: Missing content type or id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/datasets:
    get:
      summary: List loaded datasets
      operationId: listDatasets
      tags: [Datasets]
      description: Requires a bearer token with the `admin` role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of loaded datasets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DatasetInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/datasets/{name}:
    parameters:
      - $ref: '#/components/parameters/datasetName'

    get:
      summary: Get a single dataset's info
      operationId: getDataset
      tags: [Datasets]
      description: Requires a bearer token with the `admin` role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dataset info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Dataset not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update editable dataset metadata
      operationId: patchDataset
      tags: [Datasets]
      description: Requires a bearer token with the `admin` role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaPatch'
            example:
              author: jane
              description: Primary content dataset
              tags: [prod, blog]
      responses:
        '200':
          description: Updated metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metadata'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Dataset not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Dataset is legacy/unmigrated and cannot store metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/datasets/{name}/load:
    parameters:
      - $ref: '#/components/parameters/datasetName'

    post:
      summary: Load a dataset into memory
      operationId: loadDataset
      tags: [Datasets]
      description: Requires a bearer token with the `admin` role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dataset loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/datasets/{name}/unload:
    parameters:
      - $ref: '#/components/parameters/datasetName'

    post:
      summary: Unload a dataset from memory
      operationId: unloadDataset
      tags: [Datasets]
      description: |
        Requires a bearer token with the `admin` role. Drops the dataset from
        memory; the on-disk files are left untouched.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Dataset unloaded (no body)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Dataset not loaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A bearer token that is either a static API key (configured via
        `PROTOCMS_API_KEYS`) or an HS256 JWT obtained from `POST /api/login`.
        The token's role (`admin` or `editor`) governs which writes are allowed.

  responses:
    Unauthorized:
      description: Missing, malformed, or invalid bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated, but the token's role lacks permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    contentType:
      name: contentType
      in: path
      required: true
      description: Name of the content type (e.g. `post`, `dish`, `category`)
      schema:
        type: string
        example: post

    id:
      name: id
      in: path
      required: true
      description: Numeric ID of the content item
      schema:
        type: integer
        example: 1

    datasetName:
      name: name
      in: path
      required: true
      description: Name of the dataset
      schema:
        type: string
        example: default

  schemas:
    FieldType:
      type: string
      description: Supported field type identifiers
      enum:
        - text
        - textarea
        - richText
        - number
        - boolean
        - date
        - datetime
        - image
        - media
        - select
        - reference
        - slug
        - json

    FieldDefinition:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/FieldType'
        required:
          type: boolean
          description: Whether this field must be present when creating an item
          default: false
        options:
          type: array
          description: Allowed values for `select` fields
          items:
            type: string
          example: [tech, news, tutorial]
        refType:
          type: string
          description: Target content type name for `reference` fields
          example: author
        default:
          description: Default value for this field (any type)
      example:
        type: text
        required: true

    ContentType:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Unique identifier / slug for this content type
          example: post
        fields:
          type: object
          description: |
            Map of field name → FieldDefinition object describing the field's type and constraints.
          additionalProperties:
            $ref: '#/components/schemas/FieldDefinition'
          example:
            title:
              type: text
              required: true
            body:
              type: textarea
            published:
              type: boolean
              default: false

    ContentItem:
      type: object
      description: |
        A flexible key-value document. Every item always contains an auto-assigned `id` (integer).
        All other fields are defined by the content type's schema.
      properties:
        id:
          type: integer
          readOnly: true
          description: Auto-assigned item identifier
          example: 1
      additionalProperties: true
      example:
        id: 1
        title: Hello
        body: World

    ContentItemInput:
      type: object
      description: |
        Fields to set when creating or updating a content item.
        The `id` field is ignored if provided — the server always controls it.
      additionalProperties: true
      example:
        title: Hello
        body: World

    DatasetStats:
      type: object
      properties:
        dataset:
          type: string
          description: Name of the active dataset
          example: default
        content_types:
          type: integer
          description: Number of registered content type schemas
          example: 1
        total_items:
          type: integer
          description: Total number of content items across all types
          example: 2
        items_per_type:
          type: object
          description: Item count broken down by content type name
          additionalProperties:
            type: integer
          example:
            post: 2

    Metadata:
      type: object
      description: Editable and system metadata for a dataset
      properties:
        name:
          type: string
          example: default
        author:
          type: string
          example: jane
        description:
          type: string
          example: Primary content dataset
        created_at:
          type: string
          format: date-time
          example: "2026-06-13T10:00:00Z"
        modified_at:
          type: string
          format: date-time
          example: "2026-06-19T12:30:00Z"
        data_format_version:
          type: integer
          example: 2
        schema_version:
          type: integer
          example: 1
        tags:
          type: array
          items:
            type: string
          example: [prod, blog]

    MetaPatch:
      type: object
      description: |
        Editable metadata fields. All properties are optional; only the
        provided fields are updated.
      properties:
        author:
          type: string
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        schema_version:
          type: integer

    MetricsReport:
      type: object
      description: Aggregated query metrics for a dataset
      properties:
        total_queries:
          type: integer
          description: Total number of queries recorded
          example: 42
        by_op:
          type: object
          description: |
            Map of operation name (`list`, `get`, `create`, `update`,
            `delete`, `filter`) → map of content-type name → timing stats.
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              properties:
                count:
                  type: integer
                  example: 10
                avg_ms:
                  type: number
                  example: 0.42
                total_ms:
                  type: number
                  example: 4.2
          example:
            list:
              post:
                count: 10
                avg_ms: 0.42
                total_ms: 4.2

    DatasetInfo:
      type: object
      description: Full runtime info for a single dataset
      properties:
        name:
          type: string
          example: default
        data_format_version:
          type: integer
          example: 2
        meta:
          $ref: '#/components/schemas/Metadata'
        stats:
          $ref: '#/components/schemas/DatasetStats'
        approx_bytes:
          type: integer
          description: Estimated in-memory size of the dataset in bytes
          example: 4096
        metrics:
          $ref: '#/components/schemas/MetricsReport'

    Error:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
          example: not found